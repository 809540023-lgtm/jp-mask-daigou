# Render 部署設定（Blueprint）
#
# 目前線上部署的是「靜態站台」：前端純靜態 + 由瀏覽器直接把訂單送到客服信箱
# （免費方案即可運作）。
#
# 若之後想改成「後端 API 寄信」（較穩定、訂單不經過第三方），
# 只要方案額度允許，把下面 web service 區塊取消註解、部署即可；
# 前端會自動偵測到 /api/health 並改走後端。

services:
  - type: static_site
    name: jp-mask-daigou
    branch: main
    buildCommand: npm ci && npm run build:static
    publishPath: public
    autoDeploy: true

